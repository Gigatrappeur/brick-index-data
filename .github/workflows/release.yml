name: Create Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag exists
        id: tag-check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist"
          fi

      - name: Get release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | awk "NR==2{print; exit}")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD")
          else
            NOTES=$(git log --pretty=format:"- %s" HEAD)
          fi
          
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install bun
        if: steps.tag-check.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build index
        if: steps.tag-check.outputs.exists == 'false'
        run: bun run index

      - name: Create tag and release with asset
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ASSET="brick-data-${{ steps.version.outputs.version }}.zip"
          
          cd data
          zip -r "../$ASSET" . -x "*.DS_Store" ".git/*" "node_modules/*"
          cd ..
          
          gh release create "$TAG" "$ASSET" \
            --title "Release $TAG" \
            --notes "$(echo "${{ steps.notes.outputs.notes }}")"
